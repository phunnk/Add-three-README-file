<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Hunter – Săn khách hàng, xây thương hiệu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF0FF;--card:#fff;--ink:#1B1740;--mute:#625E86;--acc:#6C4DF6;--pk:#FF5C8A;--sk:#2BB5F0;--mt:#1FC8A0;--sh:#1B1740;--acc2:#F2B632;--bad:#C8472F;--line:#D5DEDD;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B26;--card:#172A3A;--ink:#E8F0F2;--mute:#9DB0BC;--acc:#4FC79A;--acc2:#F2B632;--bad:#F08467;--line:#2B4356}}
:root[data-theme="dark"]{--bg:#0F1B26;--card:#172A3A;--ink:#E8F0F2;--mute:#9DB0BC;--acc:#4FC79A;--acc2:#F2B632;--bad:#F08467;--line:#2B4356}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2.4rem;line-height:1.1;margin:.2em 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.4rem;margin:.2em 0 .4em;font-weight:800}
p{margin:.4em 0}
.mute{color:var(--mute);font-size:.92rem}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;font-size:.85rem;color:var(--mute)}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:12px 20px}
button.pri:disabled{opacity:.4;cursor:not-allowed}
button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt small{display:block;opacity:.8}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1;min-width:90px;padding:6px 8px;font-size:.88rem}
.msg{border-left:4px solid var(--acc2);padding:8px 12px;margin:12px 0;background:var(--card);border-radius:0 10px 10px 0}
.map{position:relative;width:100%;aspect-ratio:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;touch-action:none;margin:10px 0 24px;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 25%}
.dot{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--mute)}
.dot span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--mute)}
.me{width:26px;height:26px;background:var(--acc2);border:3px solid var(--ink);cursor:grab;z-index:2}
.me span{color:var(--ink);font-weight:800;top:28px}
.ax{position:absolute;font-size:.75rem;color:var(--mute)}
.score{font-size:3.4rem;font-weight:800;color:var(--acc);line-height:1}
.ok{color:var(--acc);font-weight:600}.no{color:var(--bad);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
/* giao diện nhiều màu */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#9B85FF;--pk:#FF7AA2;--sk:#4CC4F5;--mt:#3DDDB5;--sh:#000}}
body{background:radial-gradient(circle at 10% 0,rgba(255,92,138,.18),transparent 40%),radial-gradient(circle at 100% 20%,rgba(43,181,240,.2),transparent 40%),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(90deg,var(--acc),var(--pk),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2.8rem}
h2{color:var(--acc)}
.card{border:2.5px solid var(--sh);box-shadow:4px 4px 0 var(--sh);border-radius:16px}
button{border:2.5px solid var(--sh);box-shadow:3px 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
button.pri{background:var(--pk);border-color:var(--sh);font-size:1.05rem}
button.on{background:var(--acc);border-color:var(--sh);color:#fff}
.opt.c0{background:#FFD6E2;color:#1B1740}.opt.c1{background:#CFEFFC;color:#1B1740}.opt.c2{background:#D3F6EC;color:#1B1740}
.opt.on{background:var(--acc2)!important;color:#1B1740!important;transform:translate(-1px,-1px)}
.opt .ic{font-size:1.8rem;vertical-align:middle;margin-right:6px}
.bar i{height:12px;border-radius:8px;border:2px solid var(--sh);background:var(--card)}
.bar i b{background:linear-gradient(90deg,var(--mt),var(--sk),var(--acc))}
.bar{color:var(--ink);font-weight:600}
.row button.g-sv{background:#FFD6E2;color:#1B1740}.row button.g-vp{background:#CFEFFC;color:#1B1740}.row button.g-tn{background:#E2D9FF;color:#1B1740}
.row button.on{background:var(--acc2);color:#1B1740}
.msg{border-left:6px solid var(--mt);background:#D3F6EC;color:#1B1740;border-radius:0 12px 12px 0}
.map{border:2.5px solid var(--sh);box-shadow:4px 4px 0 var(--sh);background-color:#fff;
background-image:linear-gradient(135deg,rgba(255,92,138,.14),rgba(43,181,240,.14) 50%,rgba(108,77,246,.16)),linear-gradient(rgba(27,23,64,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(27,23,64,.12) 1px,transparent 1px);background-size:100% 100%,25% 25%,25% 25%}
.dot{background:var(--sk);border:2px solid var(--sh)}.dot span{color:var(--ink);font-weight:600}
.dot:nth-child(5){background:var(--pk)}.dot:nth-child(6){background:var(--mt)}
.me{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,201,60,.4)}}
@media (prefers-reduced-motion:reduce){.me{animation:none}}
.score{background:linear-gradient(90deg,var(--pk),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{font-size:3.2rem;margin:0}
.ok{color:#0E9F78}.no{color:#E0334F}
</style>
</head>
<body>
<main id="app"></main>
<script>
const AREAS=[
 {id:"dh",name:"Khu đại học",icon:"🎓",desc:"Đông sinh viên, ngân sách thấp, thích tụ tập và săn khuyến mãi.",seg:"sv"},
 {id:"vp",name:"Khu văn phòng",icon:"🏢",desc:"Nhân viên đi làm, cần đồ uống nhanh, quan tâm chất lượng.",seg:"vp"},
 {id:"dc",name:"Khu dân cư cao cấp",icon:"🏡",desc:"Thu nhập cao, ít nhạy cảm về giá, muốn trải nghiệm.",seg:"tn"}];
const SEGS={sv:"Nhóm sinh viên",vp:"Nhóm nhân viên văn phòng",tn:"Nhóm thu nhập cao"};
const PROFILES=[
 {n:"Minh, 19 tuổi",d:"Sinh viên, thu nhập thấp, hay đi cùng bạn, săn khuyến mãi",s:"sv"},
 {n:"Hà, 20 tuổi",d:"Sinh viên năm 2, ngồi quán học nhóm, thích không gian đẹp",s:"sv"},
 {n:"Tuấn, 21 tuổi",d:"Sinh viên, tiền tiêu vặt ít, ưu tiên giá rẻ",s:"sv"},
 {n:"Lan, 27 tuổi",d:"Nhân viên văn phòng, thu nhập khá, cần mua nhanh giờ nghỉ trưa",s:"vp"},
 {n:"Phong, 30 tuổi",d:"Kế toán, mua cà phê mỗi sáng trước giờ làm, quan tâm chất lượng",s:"vp"},
 {n:"Vy, 25 tuổi",d:"Nhân viên marketing, đặt đồ uống qua app cho cả nhóm",s:"vp"},
 {n:"Nam, 35 tuổi",d:"Giám đốc, thu nhập cao, quan tâm trải nghiệm, không nhạy cảm về giá",s:"tn"},
 {n:"Chi, 38 tuổi",d:"Chủ cửa hàng, sống ở khu cao cấp, chuộng sản phẩm cao cấp",s:"tn"},
 {n:"Khoa, 42 tuổi",d:"Bác sĩ, thu nhập cao, đi quán để tiếp khách và thư giãn",s:"tn"}];
const COMP=[
 {n:"Trà Bình Dân",x:20,y:25},{n:"Cà Phê Tiện Lợi",x:50,y:30},
 {n:"Café Sang",x:80,y:80},{n:"Trà Trendy",x:35,y:65}];
const IDEAL={sv:{x:15,y:50},vp:{x:60,y:45},tn:{x:88,y:62}};
const STRAT=[
 {id:"dt",name:"Marketing đại trà",d:"Một thông điệp cho tất cả mọi người",pts:0,fb:"Với 500 triệu, bán cho tất cả sẽ nhanh cháy ngân sách."},
 {id:"pb",name:"Marketing phân biệt",d:"Nhiều nhóm, mỗi nhóm một chương trình riêng",pts:10,fb:"Hợp lý nhưng tốn nguồn lực khi thương hiệu còn mới."},
 {id:"tt",name:"Marketing tập trung",d:"Dồn toàn lực vào một nhóm ngách",pts:15,fb:"Lựa chọn tốt khi nguồn lực hạn chế."},
 {id:"vm",name:"Marketing vi mô",d:"Cá nhân hóa tới từng khách",pts:8,fb:"Chính xác nhưng quá tốn kém ở giai đoạn đầu."}];
const S={step:0,area:null,assign:{},target:null,strat:null,pos:{x:50,y:50},moved:false};
const app=document.getElementById("app");
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const bar=()=>`<div class="bar">Màn ${S.step}/5<i><b style="width:${S.step*20}%"></b></i></div>`;

function render(){
 if(S.step===0) return home();
 ({1:s1,2:s2,3:s3,4:s4,5:s5})[S.step]();
 window.scrollTo(0,0);
}
function go(n){S.step=n;render()}
function home(){
 app.innerHTML=`<p class="hero">🎯🧋☕</p><h1>MARKET HUNTER</h1><h2>Săn khách hàng, xây thương hiệu</h2>
 <div class="card"><p>Bạn có <b>30 ngày</b> và <b>500 triệu</b> để đưa một thương hiệu đồ uống mới ra thị trường.</p>
 <p>Mục tiêu không phải bán cho tất cả mọi người, mà là tìm đúng nhóm khách và khiến họ nhớ đến bạn.</p></div>
 <button class="pri" id="start">Bắt đầu nhiệm vụ</button>`;
 document.getElementById("start").onclick=()=>{Object.assign(S,{area:null,assign:{},target:null,strat:null,pos:{x:50,y:50},moved:false});go(1)};
}
function s1(){
 app.innerHTML=bar()+`<h2>Bản đồ thị trường</h2><p class="mute">Chọn khu vực bạn muốn tập trung mở thương hiệu.</p>`+
 AREAS.map((a,i)=>`<button class="opt c${i} ${S.area===a.id?"on":""}" data-id="${a.id}"><span class="ic">${a.icon}</span><b>${a.name}</b><small>${a.desc}</small></button>`).join("")+
 (S.area?`<div class="msg">Bạn đang dùng <b>phân khúc theo địa lý</b>: chia thị trường theo khu vực, mật độ dân cư và đặc điểm vùng.</div>`:"")+
 `<div class="nav"><span></span><button class="pri" id="nx" ${S.area?"":"disabled"}>Tiếp tục</button></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.area=b.dataset.id;s1()});
 document.getElementById("nx").onclick=()=>go(2);
}
function s2(){
 const done=PROFILES.every((_,i)=>S.assign[i]);
 app.innerHTML=bar()+`<h2>Hồ sơ khách hàng</h2><p class="mute">Xếp mỗi khách vào nhóm phù hợp nhất dựa trên nhân khẩu học, tâm lý và hành vi.</p>`+
 PROFILES.map((p,i)=>`<div class="card"><b>${p.n}</b><p class="mute">${p.d}</p><div class="row">${Object.entries(SEGS).map(([k,v])=>`<button data-i="${i}" data-k="${k}" class="g-${k} ${S.assign[i]===k?"on":""}">${v}</button>`).join("")}</div></div>`).join("")+
 `<div class="nav"><button id="bk">Quay lại</button><button class="pri" id="nx" ${done?"":"disabled"}>Kiểm tra</button></div>`;
 app.querySelectorAll(".row button").forEach(b=>b.onclick=()=>{const y=scrollY;S.assign[b.dataset.i]=b.dataset.k;s2();scrollTo(0,y)});
 document.getElementById("bk").onclick=()=>go(1);
 document.getElementById("nx").onclick=()=>{
  const c=PROFILES.filter((p,i)=>S.assign[i]===p.s).length;S.sortOK=c;
  app.innerHTML=bar()+`<h2>Kết quả phân nhóm</h2><div class="card"><div class="score">${c}/${PROFILES.length}</div><p>khách được xếp đúng nhóm.</p></div>`+
  PROFILES.map((p,i)=>S.assign[i]!==p.s?`<p><span class="no">Sai:</span> ${p.n} thuộc <b>${SEGS[p.s]}</b>.</p>`:"").join("")+
  `<div class="msg">Bạn vừa dùng <b>phân khúc nhân khẩu học</b> (tuổi, nghề, thu nhập) kết hợp <b>tâm lý</b> và <b>hành vi</b> (thói quen mua, mức nhạy cảm về giá).</div>
  <div class="nav"><span></span><button class="pri" id="n2">Tiếp tục</button></div>`;
  document.getElementById("n2").onclick=()=>go(3);
 };
}
function s3(){
 const ok=S.target&&S.strat;
 app.innerHTML=bar()+`<h2>Chọn thị trường mục tiêu</h2><p class="mute">Bạn chọn nhóm nào để phục vụ, và tiếp cận theo cách nào?</p><h3>Nhóm khách mục tiêu</h3>`+
 Object.entries(SEGS).map(([k,v])=>`<button class="opt t c${{sv:0,vp:1,tn:2}[k]} ${S.target===k?"on":""}" data-k="${k}">${v}</button>`).join("")+
 `<h3>Chiến lược tiếp cận</h3>`+
 STRAT.map(s=>`<button class="opt s ${S.strat===s.id?"on":""}" data-k="${s.id}">${s.name}<small>${s.d}</small></button>`).join("")+
 `<div class="nav"><button id="bk">Quay lại</button><button class="pri" id="nx" ${ok?"":"disabled"}>Tiếp tục</button></div>`;
 app.querySelectorAll(".t").forEach(b=>b.onclick=()=>{const y=scrollY;S.target=b.dataset.k;s3();scrollTo(0,y)});
 app.querySelectorAll(".s").forEach(b=>b.onclick=()=>{const y=scrollY;S.strat=b.dataset.k;s3();scrollTo(0,y)});
 document.getElementById("bk").onclick=()=>go(2);
 document.getElementById("nx").onclick=()=>go(4);
}
function s4(){
 app.innerHTML=bar()+`<h2>Positioning Map</h2><p class="mute">Kéo biểu tượng vàng đến vị trí bạn muốn thương hiệu đứng trong tâm trí khách hàng. Tránh trùng đối thủ và hợp với nhóm mục tiêu.</p>
 <div class="map" id="map">
  <span class="ax" style="left:4px;bottom:4px">Giá thấp</span><span class="ax" style="right:4px;bottom:4px">Giá cao</span>
  <span class="ax" style="left:4px;top:4px">Cao cấp</span><span class="ax" style="left:4px;bottom:22px">Đơn giản</span>
  ${COMP.map(c=>`<div class="dot" style="left:${c.x}%;top:${100-c.y}%"><span>${c.n}</span></div>`).join("")}
  <div class="dot me" id="me" style="left:${S.pos.x}%;top:${100-S.pos.y}%"><span>Bạn</span></div></div>
 <div class="nav"><button id="bk">Quay lại</button><button class="pri" id="nx">Chốt định vị</button></div>`;
 const map=document.getElementById("map"),me=document.getElementById("me");
 let drag=false;
 const mv=e=>{const r=map.getBoundingClientRect();
  const x=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)),y=Math.min(100,Math.max(0,100-(e.clientY-r.top)/r.height*100));
  S.pos={x,y};S.moved=true;me.style.left=x+"%";me.style.top=(100-y)+"%"};
 map.addEventListener("pointerdown",e=>{drag=true;map.setPointerCapture(e.pointerId);mv(e)});
 map.addEventListener("pointermove",e=>{if(drag)mv(e)});
 map.addEventListener("pointerup",()=>drag=false);
 document.getElementById("bk").onclick=()=>go(3);
 document.getElementById("nx").onclick=()=>go(5);
}
function s5(){
 const area=AREAS.find(a=>a.id===S.area),st=STRAT.find(s=>s.id===S.strat);
 const fitSeg=S.target===area.seg;
 const pT=(fitSeg?25:0)+st.pts;
 const near=Math.min(...COMP.map(c=>dist(c,S.pos))),far=dist(S.pos,IDEAL[S.target]);
 const pO=near>=14?30:near>=8?15:0, pF=far<=22?30:far<=35?15:0;
 const total=pT+pO+pF;
 const lv=total>=75?["Thương hiệu ngách được yêu thích","Bạn chọn đúng khách, đúng cách và đứng ở vị trí riêng. Khách hàng mục tiêu nhớ đến bạn đầu tiên."]:
  total>=45?["Có chỗ đứng nhưng chưa vững","Hướng đi ổn nhưng còn điểm chưa rõ nét. Hãy xem lại phần bị trừ điểm bên dưới."]:
  ["Chìm giữa thị trường","Thương hiệu chưa tạo được khác biệt hoặc chưa đúng khách. Thử lại với lựa chọn khác."];
 app.innerHTML=bar()+`<h2>Kết quả sau 30 ngày</h2><div class="card"><div class="score">${total}<small style="font-size:1.2rem">/100</small></div><h3>${lv[0]}</h3><p>${lv[1]}</p></div>
 <div class="card"><h3>Vì sao có điểm này</h3>
 <p>${fitSeg?`<span class="ok">Đúng:</span>`:`<span class="no">Chưa đúng:</span>`} Bạn mở ở <b>${area.name}</b>, khách chính là <b>${SEGS[area.seg]}</b>, còn bạn chọn <b>${SEGS[S.target]}</b>. (${fitSeg?25:0}/25)</p>
 <p><span class="${st.pts>=10?"ok":"no"}">${st.name}:</span> ${st.fb} (${st.pts}/15)</p>
 <p><span class="${pO===30?"ok":"no"}">Khác biệt hóa:</span> ${pO===30?"Vị trí của bạn cách xa đối thủ.":pO===15?"Bạn hơi gần một đối thủ.":"Bạn trùng đối thủ, khách khó phân biệt."} (${pO}/30)</p>
 <p><span class="${pF===30?"ok":"no"}">Định vị hợp nhóm khách:</span> ${pF===30?"Giá và trải nghiệm đúng điều nhóm này cần.":pF===15?"Khá gần nhưng chưa tối ưu.":"Giá và trải nghiệm lệch xa mong đợi của nhóm này."} (${pF}/30)</p></div>
 <div class="card"><h3>Liên hệ lý thuyết Chương 4</h3>
 <p>Phân khúc: bạn đã chia thị trường theo địa lý, nhân khẩu học, tâm lý và hành vi.</p>
 <p>Thị trường mục tiêu: chọn nhóm phù hợp nguồn lực rồi tiếp cận theo chiến lược đã chọn.</p>
 <p>Định vị: tạo vị trí khác biệt, rõ ràng trong tâm trí khách hàng so với đối thủ.</p></div>
 <div class="nav"><button id="rp">Chơi lại với lựa chọn khác</button></div>`;
 document.getElementById("rp").onclick=()=>go(0);
}
render();
</script>
</body>
</html>
